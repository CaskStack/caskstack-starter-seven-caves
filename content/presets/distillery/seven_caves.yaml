title: "Seven Caves Distillery — Ludicrously Small Batch Craft Spirits"
meta_description: "Seven Caves Spirits crafts the finest cane-to-glass rums, coastal botanical gins, and grain-to-glass whiskeys in 120-bottle micro-batches in San Diego, CA."
brand_name: "Seven Caves Distillery"
tagline: "Ludicrously Small Batch Craft Spirits"
location: "San Diego, California • Miramar Craft District"
est_year: "2016"
distiller: "Geoff Longenecker, Founder & Master Distiller"

batch_stats:
  batch_size: "120 Bottles"
  pot_still: "100% Direct-Fired Copper Pot Still"
  grain_source: "Zero Sourced Neutral Spirits — 100% Scratch Distilled"
  distillation_origin: "La Jolla Cove Maritime Terroir"

sections:
  - type: distillery_hero
    badge: "100% Scratch Pot Distilled"
    headline: "Ludicrously Small Batch Craft Spirits"
    subheadline: "We don't cut corners. We don't take half measures. We don't buy mass quantities of cheap bulk liquor from huge industrial plants, slap our name on it and call it good. That's not how we roll. Every single drop is distilled by hand from pure whole ingredients in San Diego, California."
    cta_primary: "Explore Handcrafted Spirits"
    cta_primary_url: "#spirits-matrix"
    cta_secondary: "Book Tasting Room Flight"
    cta_secondary_url: "#tasting-room"
    hero_image: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1600&q=80"
    badge_callout: "120 Bottles / Run"

  - type: sea_caves_narrative
    eyebrow: "The Legend of the 7 Caves"
    headline: "Forged by the Pacific Ocean. Inspired by La Jolla's 7 Sea Caves."
    story_p1: "Millions of years ago, the relentless surf of the Pacific carved seven distinct sea caverns into the sandstone bluffs of La Jolla Cove: Clam's Cave, Sunny Jim's, Arch Cave, Sea Surprize, Shopping Cart, Little Sister, and White Shelf."
    story_p2: "Named in honor of these natural marine wonders, Seven Caves Distillery embodies that same unrelenting spirit. We honor maritime craftsmanship, coastal saline breezes, and true American pot distillation."
    pillars:
      - title: "Pure Cane-to-Glass"
        desc: "Raw turbinado and organic grade-A molasses fermented slow and cool for deep esters."
        icon: "fa-solid fa-seedling"
      - title: "Direct-Fired Copper"
        desc: "Handmade copper pot distillation yielding velvety richness and rich heads-and-tails cuts."
        icon: "fa-solid fa-fire-flame-curved"
      - title: "Hyper-Local Botanicals"
        desc: "San Diego Meyer lemons, coastal sea sage, and wild-harvested Pacific juniper."
        icon: "fa-solid fa-leaf"
      - title: "Never Sourced"
        desc: "Zero neutral grain spirit (NGS), zero artificial additives, zero synthetic flavorings."
        icon: "fa-solid fa-award"

  - type: spirits_tasting_matrix
    headline: "Our Handcrafted Core Expressions"
    subheadline: "Each bottle is numbered by hand with batch number, barrel fill date, and bottle allocation."
    categories:
      - name: "Artisanal Rum"
        slug: "rum"
      - name: "Botanical Gin"
        slug: "gin"
      - name: "Single-Cask Whiskey"
        slug: "whiskey"
      - name: "Exploratory Series"
        slug: "exploratory"
    products:
      - name: "La Jolla Cove Botanical Gin"
        category: "Botanical Gin"
        category_slug: "gin"
        proof: "90 Proof • 45% ABV"
        price: "$48.00"
        badge: "San Diego Craft Gold"
        description: "Vibrant coastal citrus, Meyer lemon, wild mountain juniper, coriander seed, and sea-spray salinity."
        tasting_notes: ["Meyer Lemon", "Coastal Pine", "White Pepper", "Sea Spray"]
        image: "https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=600&q=80"
      - name: "Barrel-Aged Navy Strength Rum"
        category: "Artisanal Rum"
        category_slug: "rum"
        proof: "114 Proof • 57% ABV"
        price: "$56.00"
        badge: "Cask Reserve"
        description: "Rich blackstrap molasses pot distilled and rested in charred American white oak casks for intense caramel and oak character."
        tasting_notes: ["Toasted Toffee", "Charred Molasses", "Vanilla Bean", "Warm Spice"]
        image: "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=600&q=80"
      - name: "Roasted Peanut Rum"
        category: "Exploratory Series"
        category_slug: "exploratory"
        proof: "80 Proof • 40% ABV"
        price: "$52.00"
        badge: "Cult Favorite"
        description: "Slow-infused with freshly roasted Virginia peanuts. Remarkable depth, savory peanut butter aroma, and sweet cane finish."
        tasting_notes: ["Roasted Peanut", "Dark Honey", "Toasted Brioche", "Salted Butter"]
        image: "https://images.unsplash.com/photo-1569529465841-dfecdab7503b?auto=format&fit=crop&w=600&q=80"
      - name: "Grain-to-Glass Single Malt Whiskey"
