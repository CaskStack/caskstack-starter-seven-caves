        description: "100% California-malted barley, double pot distilled and aged in heavily charred 15-gallon barrels."
        tasting_notes: ["Malted Cocoa", "Dried Fig", "Roasted Hazelnut", "Campfire Smoke"]
        image: "https://images.unsplash.com/photo-1527061011665-3652c757a4d4?auto=format&fit=crop&w=600&q=80"
      - name: "Blood Orange Rum"
        category: "Exploratory Series"
        category_slug: "exploratory"
        proof: "80 Proof • 40% ABV"
        price: "$50.00"
        badge: "Seasonal Harvest"
        description: "Infused with local San Diego blood oranges and sweet cane distillate for an electric citrus punch."
        tasting_notes: ["Candied Blood Orange", "Tangy Citrus", "Vanilla Cane", "Zesty Peel"]
        image: "https://images.unsplash.com/photo-1569529465841-dfecdab7503b?auto=format&fit=crop&w=600&q=80"
      - name: "Spiced Navy Demerara Rum"
        category: "Artisanal Rum"
        category_slug: "rum"
