  - type: exploratory_vault
    headline: "The Exploratory Micro-Vault"
    subheadline: "Ludicrously limited experimental runs of under 100 bottles. When they are gone, they are gone forever."
    vault_items:
      - title: "Rum Barrel-Aged Grade-A Maple Syrup"
        badge: "Pantry Reserve"
